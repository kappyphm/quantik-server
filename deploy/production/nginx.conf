# Loaded in nginx's http context. Log paths without OAuth query strings.
log_format quantik_safe '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=quantik_auth:10m rate=5r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://quantik.io.vn$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name quantik.io.vn;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/quantik.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quantik.io.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 256k;
    client_body_timeout 15s;
    access_log /var/log/nginx/quantik.access.log quantik_safe;
    error_log /var/log/nginx/quantik.error.log warn;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_http_version 1.1;
    proxy_set_header Host quantik.io.vn;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host quantik.io.vn;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_hide_header X-Powered-By;

    location ~ ^/(internal|docs|redoc|openapi.json)(/|$) { return 404; }
    location ~ /\. { return 404; }
    location = /health/ready { proxy_pass http://127.0.0.1:8000; }
    location = /health/live { proxy_pass http://127.0.0.1:8000; }
    location = /api/v1/webhooks/sepay {
        proxy_pass http://127.0.0.1:8000;
    }
    location ~ ^/api/v1/(admin/auth/login|auth/google/start)$ {
        limit_req zone=quantik_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }
    location / { proxy_pass http://127.0.0.1:3000; }
}
