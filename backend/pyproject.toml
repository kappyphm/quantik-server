[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantik-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.0", "uvicorn==0.54.0", "SQLAlchemy==2.0.54",
  "alembic==1.20.0", "psycopg[binary]==3.3.6", "pydantic-settings==2.15.0",
  "PyJWT[crypto]==2.15.1", "argon2-cffi==25.1.0", "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
quantik = "service.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
